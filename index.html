<!DOCTYPE html>
<html lang="es" class="no-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x-ora | Coming Soon</title>

    <!-- Importación de Tipografías según el manual -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="no-scroll">

    <!-- COMING SOON (mismo fondo que el Hero de index.html) -->
    <section class="hero hero-coming-soon">
        <video class="hero-video" id="heroVideo" autoplay muted loop playsinline preload="auto" poster="assets/hero-poster.jpg" aria-hidden="true">
            <source src="assets/Estrellas.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay" aria-hidden="true"></div>

        <img class="hero-logo-coming" src="assets/Logo.svg" alt="x-ora" width="410" height="402">

        <h1 class="hero-title">
            <span class="line"><span class="line-inner">X - ORA</span></span>
        </h1>
        <p class="hero-sub">De la incógnita a la primera luz</p>

        <p class="hero-title-xl">
            <span class="line"><span class="line-inner">Coming Soon</span></span><span class="hero-dots" aria-hidden="true"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
        </p>
    </section>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
